<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Congress API Explorer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Congress API Explorer</h1>

      <form method="POST" action="/search" class="search">
        <select name="chamber">
          <option value="house">House</option>
          <option value="senate">Senate</option>
        </select>

        <input
          name="query"
          placeholder="Keyword (e.g. climate, tax)"
          value="{{QUERY}}"
        />

        <button>Search</button>
      </form>

      <p class="message">{{MESSAGE}}</p>

      {{CARD}}

      <footer class="footer">
        <small>Data from Congress.gov API</small>
      </footer>
    </main>
  </body>
</html>
